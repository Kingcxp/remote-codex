name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: runtime/app/package-lock.json
      - name: Install app dependencies
        run: npm ci --no-audit --no-fund
        working-directory: runtime/app
      - name: Type check, test, and build
        run: .\scripts\Build-Application.ps1
        shell: powershell
      - name: Test Windows onboarding and script syntax
        run: .\tests\Onboarding.Tests.ps1
        shell: powershell
